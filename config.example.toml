# Example deskctl config.
#
# You can generate a starter file like this one automatically:
#   deskctl --genconfig                   # writes to $XDG_CONFIG_HOME/deskctl/config.toml
#   deskctl --genconfig=/custom/path.toml # writes to a custom path instead
#
# Or copy this file yourself to $XDG_CONFIG_HOME/deskctl/config.toml
# (usually ~/.config/deskctl/config.toml) and edit it.

# Named xrandr display profiles. The order of these [[displays]] entries is
# the cycle order used by `deskctl display next`. The "args" list is exactly
# what you'd type after `xrandr` on the command line - run `deskctl display
# list` (or `xrandr --query`) first to see your actual output names (e.g.
# eDP-1, HDMI-1, DP-1).
[[displays]]
name = "laptop-only"
args = ["--output", "eDP-1", "--auto", "--output", "HDMI-1", "--off"]

[[displays]]
name = "docked"
args = [
  "--output", "eDP-1", "--off",
  "--output", "HDMI-1", "--primary", "--mode", "1920x1080", "--pos", "0x0",
]

# Wallpaper profiles link to one or more display profile names. Each
# [[wallpapers]] block is one named profile with an explicit, ordered list
# of image paths - one per active screen, in the same order xrandr applies
# outputs (check with `deskctl display list`). A profile may be shared by
# multiple layouts when those layouts use the same number of screens.
#
# `deskctl wallpaper next` cycles in config order through profiles linked to
# the currently selected display profile. `deskctl wallpaper apply <name>`
# jumps straight to a compatible named profile.
[[wallpapers]]
name = "laptop-nature"
displays = ["laptop-only"]
images = ["/home/malechus/Pictures/Wallpapers/nature/001.jpg"]
# Optional: shown as the icon in the desktop notification when this profile
# is applied. Omit this line to send a plain text notification.
notification_image = "/home/malechus/Pictures/Wallpapers/nature/001.jpg"

[[wallpapers]]
name = "docked-dark"
displays = ["docked"]
images = ["/home/malechus/Pictures/Wallpapers/dark/001.jpg"]

[[wallpapers]]
name = "shared"
displays = ["laptop-only", "docked"]
images = ["/home/malechus/Pictures/Wallpapers/horizontal/044.png"]

# Settings for the systemd timer installed by `deskctl --enable`. This whole
# section - or just the "interval" line - can be omitted entirely, in which
# case it defaults to "2h". Uses systemd time span syntax, e.g. "30min",
# "1h", "1h30min".
[timer]
interval = "2h"
